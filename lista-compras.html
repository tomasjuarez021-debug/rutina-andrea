<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de compras</title>
<style>
  :root{--bg:#f6f5f1;--card:#fff;--ink:#1f2421;--muted:#8a8f8a;--accent:#2f7d4f;--line:#e7e4dc}
  @media (prefers-color-scheme:dark){:root{--bg:#141614;--card:#1d201d;--ink:#e9ebe7;--muted:#7d837d;--accent:#5bbd82;--line:#2a2e2a}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:0 0 calc(110px + env(safe-area-inset-bottom))}
  header{position:sticky;top:0;background:var(--bg);padding:16px 18px 10px;z-index:2;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:22px}
  .bar{height:6px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
  .fill{height:100%;background:var(--accent);width:0;transition:width .25s}
  .count{font-size:13px;color:var(--muted);margin-top:6px}
  section{margin:16px 12px 0;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  h2{margin:0;padding:12px 16px;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;justify-content:space-between}
  label{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);font-size:17px;cursor:pointer;user-select:none}
  input{appearance:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:7px;flex-shrink:0;display:grid;place-content:center;margin:0}
  input:checked{background:var(--accent);border-color:var(--accent)}
  input:checked::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
  input:checked + span{text-decoration:line-through;color:var(--muted)}
  .actions{position:fixed;bottom:0;left:0;right:0;display:flex;gap:10px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
  button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;font-weight:600}
  button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  body.hide label.done{display:none}
</style>
</head>
<body>
<header>
  <h1>🛒 Lista de compras</h1>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="count" id="count"></div>
</header>
<main id="list"></main>
<div class="actions">
  <button id="hideBtn">Ocultar comprados</button>
  <button id="resetBtn">Reiniciar</button>
</div>
<script>
const DATA = {
  "Verdulería y aromáticas": ["Coliflor","Paltas","Remolacha","Zanahorias","Morrones rojos","Cebollas","Papas","Batatas","Tomates perita o cherry","Ajo","Romero fresco","Menta o albahaca","Limón"],
  "Almacén": ["Nachos sin TACC","Papas Lay's Rústicas","Aceitunas","Garbanzos","Salsa de soja","Mantequilla de maní","Miel","Aceite de oliva","Vinagre"],
  "Lácteos y condimentos": ["Manteca","Humo líquido o pimentón ahumado","Sal","Pimienta","Condimentos a elección"]
};
const KEY = "lista-compras-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };

const list = document.getElementById("list");
Object.entries(DATA).forEach(([cat, items]) => {
  const sec = document.createElement("section");
  sec.innerHTML = `<h2><span>${cat}</span><span class="c"></span></h2>`;
  items.forEach(item => {
    const id = cat + "|" + item;
    const l = document.createElement("label");
    l.innerHTML = `<input type="checkbox"><span>${item}</span>`;
    const cb = l.querySelector("input");
    cb.checked = !!state[id];
    l.classList.toggle("done", cb.checked);
    cb.addEventListener("change", () => {
      state[id] = cb.checked; save();
      l.classList.toggle("done", cb.checked);
      update();
    });
    sec.appendChild(l);
  });
  list.appendChild(sec);
});

function update(){
  const all = document.querySelectorAll("input");
  const done = [...all].filter(c => c.checked).length;
  document.getElementById("fill").style.width = (done/all.length*100) + "%";
  document.getElementById("count").textContent = `${done} de ${all.length} comprados`;
  document.querySelectorAll("section").forEach(s => {
    const cbs = s.querySelectorAll("input");
    s.querySelector(".c").textContent = `${[...cbs].filter(c=>c.checked).length}/${cbs.length}`;
  });
}
update();

const hideBtn = document.getElementById("hideBtn");
hideBtn.onclick = () => {
  document.body.classList.toggle("hide");
  hideBtn.classList.toggle("on");
  hideBtn.textContent = document.body.classList.contains("hide") ? "Mostrar todos" : "Ocultar comprados";
};
document.getElementById("resetBtn").onclick = () => {
  state = {}; save();
  document.querySelectorAll("input").forEach(c => { c.checked = false; c.closest("label").classList.remove("done"); });
  update();
};
</script>
</body>
</html>
